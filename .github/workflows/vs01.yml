name: VS-01 validation

on:
  pull_request:
  push:
    branches: [main]

env:
  CORE_SHA: 4018fb124b9da21814f82c2b90706bed87991cfc

jobs:
  docs-and-default-config:
    name: Docs and default CMake configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout server
        uses: actions/checkout@v5
      - name: Check patch whitespace
        shell: bash
        run: |
          git diff-tree --check --no-commit-id -r HEAD
          test -f docs/vs-01-core-api-audit.md
          test -f docs/vs-01-memory-service-contract.md
          grep -q '4018fb124b9da21814f82c2b90706bed87991cfc' docs/vs-01-core-api-audit.md
      - name: Configure default profile
        run: cmake -S . -B build-default -G Ninja -DCMAKE_BUILD_TYPE=Release

  linux-smoke:
    name: Linux MDBX smoke (pinned core)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout server
        uses: actions/checkout@v5
      - name: Checkout audited core
        uses: actions/checkout@v5
        with:
          repository: LimiNode/agent-memory-cpp
          ref: ${{ env.CORE_SHA }}
          path: agent-memory-cpp
          submodules: recursive
          fetch-depth: 1
      - name: Configure pinned smoke
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVS01_BUILD_CORE_SMOKE=ON
          -DAGENT_MEMORY_CPP_SOURCE_DIR=${{ github.workspace }}/agent-memory-cpp
      - name: Build smoke target
        run: cmake --build build --parallel
      - name: Run registered tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows-smoke:
    name: Windows MDBX smoke (MinGW, pinned core)
    runs-on: windows-2022
    steps:
      - name: Checkout server
        uses: actions/checkout@v5
      - name: Checkout audited core
        uses: actions/checkout@v5
        with:
          repository: LimiNode/agent-memory-cpp
          ref: ${{ env.CORE_SHA }}
          path: agent-memory-cpp
          submodules: recursive
          fetch-depth: 1
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
      - name: Configure pinned smoke
        shell: msys2 {0}
        run: |
          CORE_PATH="$(cygpath -u "$GITHUB_WORKSPACE/agent-memory-cpp")"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVS01_BUILD_CORE_SMOKE=ON \
            -DAGENT_MEMORY_CPP_SOURCE_DIR="$CORE_PATH"
      - name: Build smoke target
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Run registered tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --no-tests=error
